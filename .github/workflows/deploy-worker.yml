# =============================================================================
# ARA — Worker-only deployment (GitHub Actions)
# Builds and deploys the preparation worker app service only.
# =============================================================================
name: ARA Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: dev
        options: [ dev, test, uat, prod ]
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'deploy/config/appsettings.worker.code.*.json'
      - 'deploy/scripts/apply-appsettings.ps1'
      - 'deploy/scripts/test-app-health.ps1'
      - '.github/workflows/deploy-worker.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-worker:
    name: Build & publish Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: dotnet publish
        run: |
          dotnet publish api/src/AI.Regulatory.Worker/AI.Regulatory.Worker.csproj \
            -c Release -o "${{ runner.temp }}/worker-publish"
      - name: Zip
        run: |
          cd ${{ runner.temp }}/worker-publish
          zip -r ${{ runner.temp }}/worker.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: worker-package
          path: ${{ runner.temp }}/worker.zip

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: build-worker
    environment: ara-${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: worker-package, path: ./artifacts }
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource names from latest infra deployment
        id: lookup
        run: |
          set -e
          LATEST=$(az deployment sub list \
            --query "sort_by([?starts_with(name, 'ara-${TARGET_ENV}-') && properties.outputs.resourceGroupName.value != null && properties.outputs.namePrefix.value != null], &properties.timestamp)[-1].name" \
            -o tsv || true)
          if [ -z "$LATEST" ]; then
            RG="${{ secrets.AZURE_RESOURCE_GROUP_NAME }}"
            WORKER_NAME="${{ secrets.AZURE_WORKER_APP_NAME }}"
            [ -z "$RG" ] || [ -z "$WORKER_NAME" ] && echo "ERROR: Missing infra and fallback secrets." && exit 1
            echo "rg=$RG"        >> $GITHUB_OUTPUT
            echo "worker=$WORKER_NAME" >> $GITHUB_OUTPUT
          else
            RG=$(az deployment sub show --name "$LATEST" --query "properties.outputs.resourceGroupName.value" -o tsv)
            NP=$(az deployment sub show --name "$LATEST" --query "properties.outputs.namePrefix.value" -o tsv)
            echo "rg=$RG"          >> $GITHUB_OUTPUT
            echo "worker=app-$NP-worker" >> $GITHUB_OUTPUT
          fi

      - name: Apply code-owned Worker app settings
        shell: pwsh
        run: |
          ./deploy/scripts/apply-appsettings.ps1 `
            -ResourceGroup '${{ steps.lookup.outputs.rg }}' `
            -AppName       '${{ steps.lookup.outputs.worker }}' `
            -EnvName       '${{ env.TARGET_ENV }}' `
            -App           'worker'

      - name: Deploy Worker zip (production slot — dev)
        if: env.TARGET_ENV == 'dev'
        uses: azure/webapps-deploy@v3
        with:
          app-name:            ${{ steps.lookup.outputs.worker }}
          resource-group-name: ${{ steps.lookup.outputs.rg }}
          package:             ./artifacts/worker.zip
          startup-command:     'dotnet AI.Regulatory.Worker.dll'

      - name: Deploy Worker zip (staging slot — non-dev)
        if: env.TARGET_ENV != 'dev'
        uses: azure/webapps-deploy@v3
        with:
          app-name:            ${{ steps.lookup.outputs.worker }}
          slot-name:           staging
          resource-group-name: ${{ steps.lookup.outputs.rg }}
          package:             ./artifacts/worker.zip
          startup-command:     'dotnet AI.Regulatory.Worker.dll'

      - name: Check worker runtime health
        shell: pwsh
        run: |
          $slotArgs = if ($env:TARGET_ENV -eq 'dev') { @() } else { @('--slot', 'staging') }
          $hostName = az webapp show -g '${{ steps.lookup.outputs.rg }}' -n '${{ steps.lookup.outputs.worker }}' @slotArgs --query defaultHostName -o tsv
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve worker hostname.' }
          ./deploy/scripts/test-app-health.ps1 -BaseUrl "https://$hostName" -Paths '/health/live'

      - name: Blue/Green slot swap (non-dev)
        if: env.TARGET_ENV != 'dev'
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ steps.lookup.outputs.rg }}" \
            --name "${{ steps.lookup.outputs.worker }}" \
            --slot staging --target-slot production
