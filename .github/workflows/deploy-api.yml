# =============================================================================
# ARA — API-only deployment (GitHub Actions)
# Builds and deploys the .NET API app service only.
# =============================================================================
name: ARA Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        default: dev
        options: [ dev, test, uat, prod ]
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'deploy/config/appsettings.api.code.*.json'
      - 'deploy/scripts/apply-appsettings.ps1'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write
  contents: read

jobs:
  build-api:
    name: Build & publish API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: dotnet publish
        run: |
          dotnet publish api/src/AI.Regulatory.API/AI.Regulatory.API.csproj \
            -c Release -o "${{ runner.temp }}/api-publish"
      - name: Zip
        run: |
          cd ${{ runner.temp }}/api-publish
          zip -r ${{ runner.temp }}/api.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: ${{ runner.temp }}/api.zip

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build-api
    environment: ara-${{ inputs.environment || 'dev' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: api-package, path: ./artifacts }
      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve resource names from latest infra deployment
        id: lookup
        run: |
          set -e
          LATEST=$(az deployment sub list \
            --query "sort_by([?starts_with(name, 'ara-${TARGET_ENV}-')], &properties.timestamp)[-1].name" \
            -o tsv || true)
          if [ -z "$LATEST" ]; then
            RG="${{ secrets.AZURE_RESOURCE_GROUP_NAME }}"
            API_NAME="${{ secrets.AZURE_API_APP_NAME }}"
            [ -z "$RG" ] || [ -z "$API_NAME" ] && echo "ERROR: Missing infra and fallback secrets." && exit 1
            echo "rg=$RG"        >> $GITHUB_OUTPUT
            echo "api=$API_NAME" >> $GITHUB_OUTPUT
          else
            RG=$(az deployment sub show --name "$LATEST" --query "properties.outputs.resourceGroupName.value" -o tsv)
            NP=$(az deployment sub show --name "$LATEST" --query "properties.outputs.namePrefix.value" -o tsv)
            echo "rg=$RG"          >> $GITHUB_OUTPUT
            echo "api=app-$NP-api" >> $GITHUB_OUTPUT
          fi

      - name: Apply code-owned API app settings
        shell: pwsh
        run: |
          ./deploy/scripts/apply-appsettings.ps1 `
            -ResourceGroup '${{ steps.lookup.outputs.rg }}' `
            -AppName       '${{ steps.lookup.outputs.api }}' `
            -EnvName       '${{ env.TARGET_ENV }}' `
            -App           'api'

      - name: Deploy API zip (production slot — dev)
        if: env.TARGET_ENV == 'dev'
        uses: azure/webapps-deploy@v3
        with:
          app-name:            ${{ steps.lookup.outputs.api }}
          resource-group-name: ${{ steps.lookup.outputs.rg }}
          package:             ./artifacts/api.zip

      - name: Deploy API zip (staging slot — non-dev)
        if: env.TARGET_ENV != 'dev'
        uses: azure/webapps-deploy@v3
        with:
          app-name:            ${{ steps.lookup.outputs.api }}
          slot-name:           staging
          resource-group-name: ${{ steps.lookup.outputs.rg }}
          package:             ./artifacts/api.zip

      - name: Blue/Green slot swap (non-dev)
        if: env.TARGET_ENV != 'dev'
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ steps.lookup.outputs.rg }}" \
            --name "${{ steps.lookup.outputs.api }}" \
            --slot staging --target-slot production
